name: tests

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none

      - name: verify supported PHP version
        run: |
          php -r 'exit(PHP_VERSION_ID >= 80512 && PHP_INT_SIZE === 8 ? 0 : 1);'

      - name: install
        run: composer install --no-interaction --prefer-dist

      - name: run tests
        run: |
          composer check-platform-reqs
          vendor/bin/phpunit --bootstrap vendor/autoload.php --do-not-cache-result Tests
          php Demo/index.php

      - name: check dependency security advisories
        run: composer audit --locked

  reject-unsupported-php:
    runs-on: ubuntu-latest
    container: php:${{ matrix.php }}-cli
    strategy:
      matrix:
        php: ["8.4.27", "8.5.11"]
    steps:
      - uses: actions/checkout@v4
      - name: verify exact PHP version
        env:
          EXPECTED_PHP_VERSION: ${{ matrix.php }}
        run: |
          php -r 'exit(PHP_VERSION === getenv("EXPECTED_PHP_VERSION") ? 0 : 1);'
      - name: install Composer
        run: |
          curl --fail --silent --show-error --location https://github.com/composer/composer/releases/download/2.8.12/composer.phar --output /tmp/particle-composer.phar
          php -r '$phar = new Phar("/tmp/particle-composer.phar"); exit($phar->getSignature()["hash_type"] === "SHA-512" ? 0 : 1);'
      - name: reject unsupported PHP at runtime
        run: |
          php -r '
          try {
              require "Sources/Particle.php";
          } catch (RuntimeException $e) {
              if ($e->getMessage() === "Particle requires 64-bit PHP 8.5.12 or newer.") {
                  exit(0);
              }
              throw $e;
          }
          fwrite(STDERR, "Unsupported PHP was accepted.\n");
          exit(1);'
      - name: reject unsupported PHP in Composer
        run: |
          if php /tmp/particle-composer.phar check-platform-reqs --lock --format=json > /tmp/platform-check.json; then
            echo "Unsupported PHP was accepted by Composer."
            exit 1
          fi
          php -r '
          $checks = json_decode(file_get_contents("/tmp/platform-check.json"), true, 512, JSON_THROW_ON_ERROR);
          foreach ($checks as $check) {
              if ($check["name"] === "php" && $check["status"] === "failed") {
                  exit(0);
              }
          }
          fwrite(STDERR, "Composer did not report a PHP version failure.\n");
          exit(1);'
